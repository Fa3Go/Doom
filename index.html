<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>毀滅戰士 JS</title>
<style>
/* Layout: one full-bleed canvas, letterboxed at 4:3, touch controls float above it. Single dark look by choice. */
:root {
  --void: #000000;
  --blood: #c8160e;
  --brass: #e8b422;
  --steel: #3a3833;
  --bone: #f2e8d5;
  --font-ui: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { margin: 0; height: 100%; background: var(--void); color: var(--bone); overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
#screen { display: block; width: 100%; height: 100%; cursor: crosshair; }
#touch { position: fixed; right: 0; bottom: 0; padding: 0 calc(16px + env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) 0; display: flex; gap: 12px; align-items: flex-end; }
#touch[hidden] { display: none; }
#touch button {
  font: 700 16px var(--font-ui); color: var(--bone); background: rgba(58, 56, 51, 0.55);
  border: 2px solid rgba(242, 232, 213, 0.5); border-radius: 50%; width: 64px; height: 64px; touch-action: none;
}
#touch #btnFire { width: 84px; height: 84px; background: rgba(200, 22, 14, 0.55); border-color: rgba(232, 180, 34, 0.8); }
#touch button:focus-visible { outline: 3px solid var(--brass); }
</style>

<canvas id="screen" aria-label="毀滅戰士遊戲畫面"></canvas>
<div id="touch" hidden>
  <button id="btnSwap" type="button">換槍</button>
  <button id="btnFire" type="button">開火</button>
</div>

<script>
'use strict';
// ============================================================
//  毀滅戰士 JS — 單檔光線投射 (raycasting) 射擊遊戲
// ============================================================
const W = 320, H = 240, VH = 200, HALF = VH / 2, TS = 64;
const canvas = document.getElementById('screen');
const sctx = canvas.getContext('2d');
const buf = document.createElement('canvas'); buf.width = W; buf.height = H;
const bctx = buf.getContext('2d');
const img = bctx.createImageData(W, VH);
const pix = new Uint32Array(img.data.buffer);
const zbuf = new Float32Array(W);
const isTouch = window.matchMedia ? matchMedia('(pointer: coarse)').matches : 'ontouchstart' in window;

// ---------- 工具 ----------
function rgb(r, g, b) { return (255 << 24) | ((b & 255) << 16) | ((g & 255) << 8) | (r & 255); }
function shade(c, f) {
  const r = (c & 255) * f, g = ((c >> 8) & 255) * f, b = ((c >> 16) & 255) * f;
  return (255 << 24) | (b << 16) | (g << 8) | r;
}
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rand = Math.random;
const randInt = (a, b) => a + Math.floor(rand() * (b - a + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const fog = d => clamp(1.15 - d / 13, 0.1, 1);

// ---------- 材質產生 ----------
function makeTex(fn) { const t = new Uint32Array(TS * TS); for (let y = 0; y < TS; y++) for (let x = 0; x < TS; x++) t[y * TS + x] = fn(x, y); return t; }
function canvasTex(size, draw) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'); draw(g);
  return new Uint32Array(g.getImageData(0, 0, size, size).data.buffer.slice(0));
}
const TEX = {};
(function buildTextures() {
  let R = rng(7);
  // 1 紅磚
  TEX[1] = makeTex((x, y) => {
    const row = y >> 3, off = (row & 1) * 8;
    if ((y & 7) === 0 || ((x + off) & 15) === 0) return rgb(70, 64, 58);
    const n = R() * 35; return rgb(130 + n, 46 + n * 0.5, 32 + n * 0.3);
  });
  // 2 石塊
  TEX[2] = makeTex((x, y) => {
    const row = y >> 4, off = (row & 1) * 16;
    if ((y & 15) === 0 || ((x + off) & 31) === 0) return rgb(40, 40, 42);
    const n = R() * 40 + Math.sin(x * 0.7 + y * 0.3) * 6; return rgb(100 + n, 98 + n, 92 + n);
  });
  // 3 科技金屬板
  TEX[3] = makeTex((x, y) => {
    const px = x & 31, py = y & 31, c = 78 + R() * 14;
    if (px === 0 || py === 0) return rgb(28, 28, 36);
    if (px === 31 || py === 31) return rgb(140, 142, 160);
    if ((px === 4 || px === 27) && (py === 4 || py === 27)) return rgb(210, 210, 220);
    if (y >= 29 && y <= 34 && x > 8 && x < 56) return ((x >> 2) & 1) ? rgb(60, 210, 255) : rgb(20, 120, 190);
    return rgb(c, c + 4, c + 18);
  });
  // 4 門
  TEX[4] = makeTex((x, y) => {
    if (x < 5 || x > 58) return (((y >> 2) + (x < 5 ? 0 : 1)) & 1) ? rgb(230, 180, 0) : rgb(20, 20, 20);
    if (y > 27 && y < 37) return (x & 7) === 0 ? rgb(60, 60, 70) : rgb(125, 125, 135);
    const n = R() * 18;
    if (x % 9 === 0) return rgb(55, 38, 20);
    return rgb(115 + n, 78 + n * 0.6, 40 + n * 0.3);
  });
  // 5 出口開關
  TEX[5] = canvasTex(TS, g => {
    g.fillStyle = '#5a5e6a'; g.fillRect(0, 0, 64, 64);
    g.fillStyle = '#2a2c34'; g.fillRect(0, 0, 64, 2); g.fillRect(0, 62, 64, 2);
    g.fillStyle = '#111'; g.fillRect(8, 6, 48, 18);
    g.fillStyle = '#2f2'; g.font = 'bold 14px monospace'; g.textAlign = 'center'; g.fillText('EXIT', 32, 20);
    g.fillStyle = '#222'; g.fillRect(20, 30, 24, 28);
    g.fillStyle = '#888'; g.fillRect(23, 33, 18, 22);
    g.fillStyle = '#d22'; g.fillRect(28, 36, 8, 10);
    g.fillStyle = '#ccc'; g.fillRect(30, 46, 4, 8);
  });
  // 6 血肉牆
  R = rng(99);
  TEX[6] = makeTex((x, y) => {
    const v = Math.sin(x * 0.25 + Math.sin(y * 0.18) * 3) + Math.sin(y * 0.31 + x * 0.05) * 0.6;
    const n = R() * 30;
    if (Math.abs(v) < 0.12) return rgb(60 + n, 8, 10);
    if (Math.abs(v - 1) < 0.08) return rgb(200, 150 + n, 120);
    return rgb(120 + n + v * 15, 30 + n * 0.3, 28 + n * 0.3);
  });
  // 地板 / 天花板
  R = rng(3);
  TEX.floor = makeTex((x, y) => {
    if ((x & 31) === 0 || (y & 31) === 0) return rgb(30, 28, 24);
    const n = R() * 22; const s = ((x >> 5) + (y >> 5)) & 1 ? 8 : 0;
    return rgb(66 + n + s, 60 + n + s, 50 + n);
  });
  TEX.ceil = makeTex((x, y) => {
    const px = x & 31, py = y & 31;
    if (px > 11 && px < 20 && py > 11 && py < 20) return rgb(255, 250, 210);
    if (px === 0 || py === 0) return rgb(25, 25, 28);
    const n = R() * 14; return rgb(54 + n, 54 + n, 58 + n);
  });
})();
const WALLCHAR = { '#': 1, 'S': 2, 'T': 3, 'D': 4, 'X': 5, 'F': 6 };
const DOOR = 4, EXIT = 5;

// ---------- 精靈圖 ----------
const SPR = {};
function spr(draw) { return canvasTex(TS, g => { g.lineWidth = 1; draw(g); }); }
function circle(g, x, y, r, c) { g.fillStyle = c; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); }
function spike(g, x, y, dir) { g.beginPath(); g.moveTo(x - 2, y); g.lineTo(x + 2, y); g.lineTo(x + dir * 4, y - 6); g.closePath(); g.fill(); }

const MONSTER_LOOK = {
  zombie: { skin: '#9a9a78', body: '#4d5b2c', dark: '#2a3518', eye: '#d00' },
  imp:    { skin: '#8b5a2b', body: '#6e3c1c', dark: '#3b1a0b', eye: '#ff3' },
  demon:  { skin: '#e08a9a', body: '#c9677c', dark: '#7a2d3f', eye: '#f22' },
  baron:  { skin: '#c9a27a', body: '#9a3b2a', dark: '#3c5a2a', eye: '#3f3' },
};
function drawMonster(g, type, frame) {
  const L = MONSTER_LOOK[type];
  if (frame === 4) { // 屍體
    g.fillStyle = '#6a0000'; g.beginPath(); g.ellipse(32, 59, 27, 5, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = L.body; g.fillRect(12, 53, 34, 7);
    g.fillStyle = L.dark; g.fillRect(8, 55, 8, 5);
    circle(g, 50, 55, 5, L.skin);
    g.fillStyle = '#b00'; g.fillRect(22, 52, 12, 4); g.fillRect(40, 57, 6, 3);
    return;
  }
  if (type === 'demon') {
    const step = frame === 1 ? 3 : 0;
    g.fillStyle = L.dark; g.fillRect(18 - step, 44, 9, 18); g.fillRect(37 + step, 44, 9, 18);
    g.fillStyle = L.body; g.beginPath(); g.ellipse(32, 36, 20, 15, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = L.skin; g.beginPath(); g.ellipse(32, 30, 15, 9, 0, 0, Math.PI * 2); g.fill();
    // 大嘴
    g.fillStyle = '#300'; g.beginPath(); g.ellipse(32, 36, 11, frame === 2 ? 10 : 5, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#fff'; for (let i = 0; i < 6; i++) { g.fillRect(23 + i * 3.4, 32, 2, 3); g.fillRect(23 + i * 3.4, frame === 2 ? 42 : 38, 2, 3); }
    g.fillStyle = L.eye; g.fillRect(24, 24, 4, 3); g.fillRect(36, 24, 4, 3);
    g.fillStyle = '#ddc'; spike(g, 20, 22, -1); spike(g, 44, 22, 1);
    g.fillStyle = L.body; g.fillRect(10, 34 + (frame === 2 ? -8 : 0), 6, 14); g.fillRect(48, 34 + (frame === 2 ? -8 : 0), 6, 14);
  } else {
    const big = type === 'baron';
    const step = frame === 1 ? 3 : 0;
    g.fillStyle = L.dark; g.fillRect(24 - step, 40, 7, 22); g.fillRect(33 + step, 40, 7, 22);
    g.fillStyle = big ? '#2a1a10' : '#222'; g.fillRect(22 - step, 59, 10, 5); g.fillRect(32 + step, 59, 10, 5);
    g.fillStyle = L.body; g.fillRect(20, 20, 24, 22);
    g.fillStyle = 'rgba(0,0,0,0.3)'; g.fillRect(31, 20, 2, 20);
    g.fillStyle = '#333'; g.fillRect(20, 38, 24, 3);
    circle(g, 32, 13, 8, L.skin);
    g.fillStyle = L.eye; g.fillRect(27, 11, 4, 2); g.fillRect(33, 11, 4, 2);
    g.fillStyle = '#300'; g.fillRect(29, 16, 6, 2);
    if (type === 'imp' || big) {
      g.fillStyle = '#ddc';
      spike(g, 22, 22, -1); spike(g, 42, 22, 1); spike(g, 21, 31, -1); spike(g, 43, 31, 1);
      if (big) { g.fillStyle = '#eee'; spike(g, 25, 8, -1); spike(g, 39, 8, 1); spike(g, 23, 6, -1); spike(g, 41, 6, 1); }
      else { spike(g, 27, 6, -1); spike(g, 37, 6, 1); }
    }
    if (frame === 2) {
      if (type === 'zombie') {
        g.fillStyle = L.body; g.fillRect(17, 22, 6, 8); g.fillRect(41, 22, 6, 8);
        g.fillStyle = '#222'; g.fillRect(25, 26, 14, 5);
        circle(g, 32, 29, 6, '#ff0'); circle(g, 32, 29, 3, '#fff');
      } else {
        const fire = big ? '#3f3' : '#f80', core = big ? '#cfc' : '#ff0';
        g.fillStyle = L.skin; g.fillRect(12, 8, 6, 16); g.fillRect(46, 8, 6, 16);
        circle(g, 15, 7, 6, fire); circle(g, 15, 7, 3, core);
      }
    } else {
      g.fillStyle = type === 'zombie' ? L.body : L.skin;
      g.fillRect(14, 22, 6, 18); g.fillRect(44, 22, 6, 18);
      if (type === 'zombie') { g.fillStyle = '#222'; g.fillRect(42, 30, 4, 16); }
      else { g.fillStyle = '#eee'; g.fillRect(13, 39, 2, 3); g.fillRect(17, 39, 2, 3); g.fillRect(45, 39, 2, 3); g.fillRect(49, 39, 2, 3); }
    }
  }
  if (frame === 3) {
    g.globalCompositeOperation = 'source-atop'; g.fillStyle = 'rgba(255,40,40,0.5)'; g.fillRect(0, 0, 64, 64);
    g.globalCompositeOperation = 'source-over';
  }
}
(function buildSprites() {
  for (const t of Object.keys(MONSTER_LOOK)) { SPR[t] = []; for (let f = 0; f < 5; f++) SPR[t].push(spr(g => drawMonster(g, t, f))); }
  SPR.health = spr(g => { g.fillStyle = '#eee'; g.fillRect(20, 46, 24, 17); g.fillStyle = '#d00'; g.fillRect(29, 48, 6, 13); g.fillRect(24, 52, 16, 5); g.fillStyle = '#999'; g.fillRect(20, 61, 24, 2); });
  SPR.bullets = spr(g => { g.fillStyle = '#5b4a2a'; g.fillRect(22, 52, 20, 11); g.fillStyle = '#e8b422'; for (let i = 0; i < 5; i++) { g.fillRect(24 + i * 3.5, 46, 2, 7); } g.fillStyle = '#b48a1a'; for (let i = 0; i < 5; i++) g.fillRect(24 + i * 3.5, 46, 2, 2); });
  SPR.shells = spr(g => { g.fillStyle = '#7a2222'; g.fillRect(18, 52, 28, 11); g.fillStyle = '#d33'; for (let i = 0; i < 4; i++) g.fillRect(21 + i * 6, 45, 4, 8); g.fillStyle = '#e8b422'; for (let i = 0; i < 4; i++) g.fillRect(21 + i * 6, 51, 4, 2); });
  SPR.shotgun = spr(g => { g.fillStyle = '#333'; g.fillRect(6, 54, 44, 4); g.fillStyle = '#6b4220'; g.fillRect(40, 53, 18, 7); g.fillRect(22, 57, 12, 4); g.fillStyle = '#777'; g.fillRect(6, 54, 44, 1); });
  SPR.chaingun = spr(g => { g.fillStyle = '#444'; g.fillRect(8, 50, 40, 10); g.fillStyle = '#222'; for (let i = 0; i < 3; i++) g.fillRect(2, 51 + i * 3, 10, 2); g.fillStyle = '#666'; g.fillRect(44, 48, 14, 14); g.fillStyle = '#999'; g.fillRect(8, 50, 40, 2); });
  SPR.armor = spr(g => { g.fillStyle = '#2a8a2a'; g.beginPath(); g.moveTo(20, 42); g.lineTo(28, 40); g.lineTo(32, 45); g.lineTo(36, 40); g.lineTo(44, 42); g.lineTo(43, 63); g.lineTo(21, 63); g.closePath(); g.fill(); g.fillStyle = '#5c5'; g.fillRect(24, 48, 16, 3); g.fillRect(24, 54, 16, 3); });
  SPR.barrel = spr(g => { g.fillStyle = '#3d6b2a'; g.fillRect(20, 30, 24, 34); g.fillStyle = '#2a4a1d'; g.fillRect(20, 38, 24, 3); g.fillRect(20, 54, 24, 3); g.fillStyle = '#5a9a3a'; g.fillRect(23, 30, 4, 34); g.fillStyle = '#7f7'; g.beginPath(); g.ellipse(32, 31, 11, 3, 0, 0, Math.PI * 2); g.fill(); g.fillStyle = '#ddd'; g.font = 'bold 9px monospace'; g.fillText('☢', 27, 51); });
  SPR.explode = [0, 1, 2].map(f => spr(g => { const r = 12 + f * 9; circle(g, 32, 64 - r - 2, r, f === 2 ? '#a30' : '#f60'); circle(g, 32, 64 - r - 2, r * 0.7, f === 2 ? '#d50' : '#fa0'); circle(g, 32, 64 - r - 2, r * 0.35, '#ffd'); }));
  SPR.fireball = [0, 1].map(f => spr(g => { circle(g, 32, 32, 22 - f * 3, '#f40'); circle(g, 32, 32, 15, '#fa0'); circle(g, 32 + f * 3, 30, 8, '#ffe'); }));
  SPR.greenball = [0, 1].map(f => spr(g => { circle(g, 32, 32, 22 - f * 3, '#0a0'); circle(g, 32, 32, 15, '#4f4'); circle(g, 32 + f * 3, 30, 8, '#efe'); }));
  SPR.puff = [0, 1].map(f => spr(g => { circle(g, 32, 32, 14 + f * 8, f ? 'rgba(160,160,160,0.9)' : '#ddd'); if (!f) circle(g, 32, 32, 7, '#ff8'); }));
  SPR.blood = [0, 1].map(f => spr(g => { circle(g, 32, 32, 12 + f * 6, '#b00'); circle(g, 22, 38, 6, '#800'); circle(g, 42, 24, 5, '#d00'); }));
})();

// ---------- 關卡資料 ----------
const LEVELS = [
{ name: '第一關:機庫', map: [
"TTTTTTTTTTTTTTTTTTTTTTTT",
"T......T.........T.....T",
"T.P....T...z.....T..i..T",

{ name: '第二關:地獄入口', map: [

"FSSDSSSSSSSSDSSSSSSSDSSF",
"F.....F.........F......F",

{ name: '第三關:魔王巢穴', boss: true, map: [

];

const MDEF = {
  zombie: { hp: 20,  speed: 1.3, attack: 'hitscan',  dmg: [3, 12],  cool: 1.6, range: 14, pain: 0.7, scale: 1,    width: 0.45, drop: 'bullets' },
  imp:    { hp: 60,  speed: 1.6, attack: 'fireball', dmg: [8, 20],  cool: 2.0, range: 16, pain: 0.45, scale: 1,   width: 0.45 },
  demon:  { hp: 150, speed: 2.8, attack: 'melee',    dmg: [10, 28], cool: 0.9, range: 1.3, pain: 0.3, scale: 1,   width: 0.6 },
  baron:  { hp: 700, speed: 1.5, attack: 'fireball', dmg: [20, 40], cool: 1.4, range: 20, pain: 0.1, scale: 1.5, width: 0.5, boss: true },

const WEAPONS = {

  2: { name: '霰彈槍', ammo: 'shells',  cd: 0.9,  pellets: 7, spread: 26, dmg: [6, 15] },

};
const MAXAMMO = { bullets: 200, shells: 50 };

// ---------- 遊戲狀態 ----------
let state = 'title'; // title | play | paused | dead | levelDone | victory
let levelIdx = 0, map, MW, MH, doors, ents, player, levelTime = 0, totalMonsters = 0;
let carry = null; // 跨關保留的玩家狀態
let messages = [], flashRed = 0, flashGold = 0, showMap = false, bossAlive = false;
let weaponKick = 0, muzzle = 0, bobT = 0, moveAmt = 0, faceTimer = 0, faceLook = 0, grin = 0;

function freshPlayer() {
  return { health: 100, armor: 0, ammo: { bullets: 50, shells: 0 }, weapons: { 1: true, 2: false, 3: false }, cur: 1 };
}
function loadLevel(i) {
  levelIdx = i;
  const L = LEVELS[i];
  MH = L.map.length; MW = L.map[0].length;
  map = new Uint8Array(MW * MH); doors = new Map(); ents = [];
  if (!carry) carry = freshPlayer();
  const c = JSON.parse(JSON.stringify(carry));
  player = Object.assign(c, { x: 1.5, y: 1.5, a: 0, cd: 0, kills: 0, dead: false });
  totalMonsters = 0; bossAlive = false;
  const mtype = { z: 'zombie', i: 'imp', d: 'demon', B: 'baron' };
  const ptype = { h: 'health', a: 'bullets', s: 'shells', g: 'shotgun', c: 'chaingun', r: 'armor' };
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    const ch = L.map[y][x];
    if (WALLCHAR[ch]) map[y * MW + x] = WALLCHAR[ch];
    const cx = x + 0.5, cy = y + 0.5;
    if (ch === 'P') { player.x = cx; player.y = cy; player.a = facingOpen(x, y, L.map); }
    else if (mtype[ch]) { addMonster(mtype[ch], cx, cy); }
    else if (ptype[ch]) ents.push({ kind: 'pickup', type: ptype[ch], x: cx, y: cy });
    else if (ch === 'b') ents.push({ kind: 'barrel', x: cx, y: cy, hp: 20, boom: -1 });
  }
  levelTime = 0; messages = []; flashRed = flashGold = 0;
  say(L.name, 3);
  if (L.boss) say('擊敗地獄男爵才能打開出口!', 4);
}
function facingOpen(x, y, m) {
  const dirs = [[1, 0, 0], [0, 1, Math.PI / 2], [-1, 0, Math.PI], [0, -1, -Math.PI / 2]];
  for (const [dx, dy, a] of dirs) if (m[y + dy][x + dx] === '.') return a;

}
function addMonster(type, x, y) {

// ---------- 地圖查詢 ----------
function tileAt(x, y) { return (x < 0 || y < 0 || x >= MW || y >= MH) ? 1 : map[y * MW + x]; }

}

}

}

// ---------- 音效 (WebAudio 合成) ----------
let actx = null, master = null, noiseBuffer = null;

      noiseBuffer = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
      const d = noiseBuffer.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

}

  if (!actx || v <= 0.01) return;
  switch (name) {
    case 'pistol': noise(0.18, 2500, 0.6 * v); tone('square', 180, 60, 0.08, 0.15 * v); break;
    case 'shotgun': noise(0.45, 1300, 0.9 * v); tone('sine', 110, 40, 0.3, 0.6 * v); break;
    case 'chaingun': noise(0.1, 2800, 0.45 * v); break;
    case 'enemyShot': noise(0.15, 1800, 0.4 * v); break;
    case 'fireball': tone('sawtooth', 300, 60, 0.45, 0.18 * v); noise(0.4, 700, 0.2 * v); break;
    case 'explode': noise(0.9, 500, 1.0 * v); tone('sine', 80, 25, 0.7, 0.7 * v); break;
    case 'hurt': tone('square', 240, 90, 0.22, 0.22 * v); break;
    case 'die': tone('sawtooth', 320, 40, 0.6, 0.25 * v); noise(0.3, 600, 0.2 * v, 0.1); break;
    case 'pain': tone('square', 420, 180, 0.15, 0.15 * v); break;
    case 'alert': tone('sawtooth', 120, 260, 0.35, 0.2 * v); tone('sawtooth', 125, 240, 0.35, 0.15 * v, 0.05); break;
    case 'melee': noise(0.12, 900, 0.5 * v); tone('square', 90, 50, 0.15, 0.3 * v); break;
    case 'pickup': tone('square', 660, 660, 0.06, 0.15); tone('square', 990, 990, 0.08, 0.15, 0.06); break;
    case 'weapon': [523, 659, 784, 1046].forEach((f, i) => tone('square', f, f, 0.09, 0.14, i * 0.07)); break;
    case 'door': noise(0.7, 260, 0.5 * v); tone('sawtooth', 55, 45, 0.6, 0.12 * v); break;
    case 'click': tone('square', 1200, 800, 0.03, 0.1); break;
    case 'exit': [392, 523, 659, 784, 1046].forEach((f, i) => tone('triangle', f, f, 0.2, 0.25, i * 0.12)); break;
    case 'playerDie': tone('sawtooth', 300, 30, 1.2, 0.35); noise(0.8, 400, 0.3); break;

// ---------- 輸入 ----------
const keys = {};
let mouseDX = 0, firing = false, locked = false, everLocked = false, dragTurn = false;
const touchMove = { id: null, ox: 0, oy: 0, dx: 0, dy: 0 }, touchLook = { id: null, lx: 0 };

addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(e.code)) e.preventDefault();
  if (state === 'play') {
    if (e.code === 'Digit1' || e.code === 'Digit2' || e.code === 'Digit3') selectWeapon(+e.code.slice(5));
    if (e.code === 'KeyM' || e.code === 'Tab') showMap = !showMap;
    if (e.code === 'KeyE') useAction();
    if (e.code === 'KeyQ') cycleWeapon();
  } else if ((e.code === 'Enter' || e.code === 'Space') && state !== 'play') { advanceScreen(); }
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; firing = false; });

canvas.addEventListener('mousedown', e => {
  if (isTouch && e.sourceCapabilities && e.sourceCapabilities.firesTouchEvents) return;
  if (state === 'play') {
    if (!locked && !everLocked) requestLock();
    if (e.button === 0) firing = true;
    if (!locked) dragTurn = true;
  }
});
addEventListener('mouseup', () => { firing = false; dragTurn = false; });
addEventListener('mousemove', e => { if (locked || dragTurn) mouseDX += e.movementX || 0; });

function requestLock() {
  if (isTouch || !canvas.requestPointerLock) return;

}

function advanceScreen() {
  initAudio();
  if (state === 'title') { carry = null; loadLevel(0); state = 'play'; requestLock(); }
  else if (state === 'paused') { state = 'play'; requestLock(); }
  else if (state === 'dead') { loadLevel(levelIdx); state = 'play'; requestLock(); }
  else if (state === 'levelDone') { loadLevel(levelIdx + 1); state = 'play'; requestLock(); }
  else if (state === 'victory') { state = 'title'; }

}

// 觸控
canvas.addEventListener('touchstart', e => {
  initAudio();
  if (state !== 'play') { e.preventDefault(); advanceScreen(); return; }
  for (const t of e.changedTouches) {
    if (t.clientX < innerWidth * 0.45 && touchMove.id === null) { touchMove.id = t.identifier; touchMove.ox = t.clientX; touchMove.oy = t.clientY; touchMove.dx = touchMove.dy = 0; }
    else if (touchLook.id === null) { touchLook.id = t.identifier; touchLook.lx = t.clientX; }

    else if (t.identifier === touchLook.id) { mouseDX += (t.clientX - touchLook.lx) * 2.2; touchLook.lx = t.clientX; }

const touchUI = document.getElementById('touch');
const btnFire = document.getElementById('btnFire'), btnSwap = document.getElementById('btnSwap');
btnFire.addEventListener('touchstart', e => { e.preventDefault(); firing = true; }, { passive: false });

// ---------- 玩家動作 ----------
function selectWeapon(n) {
  if (!player.weapons[n] || player.cur === n) return;
  player.cur = n; sfx('click'); weaponKick = 1;
}
function cycleWeapon() {
  for (let i = 1; i <= 3; i++) { const n = (player.cur + i - 1) % 3 + 1; if (player.weapons[n] && player.ammo[WEAPONS[n].ammo] > 0) { selectWeapon(n); return; } }
}
function frontTile(d = 0.9) { return [Math.floor(player.x + Math.cos(player.a) * d), Math.floor(player.y + Math.sin(player.a) * d)]; }

  const [tx, ty] = frontTile();
  const t = tileAt(tx, ty);
  if (t === DOOR) openDoor(tx, ty);
  else if (t === EXIT) {
    if (bossAlive) { say('出口被魔力封印了——先擊敗地獄男爵!'); sfx('click'); return; }

}

  if (document.pointerLockElement) document.exitPointerLock();
  state = levelIdx + 1 >= LEVELS.length ? 'victory' : 'levelDone';
  updateTouchUI();
}
function damagePlayer(dmg, srcX, srcY) {
  if (player.dead) return;
  const saved = Math.min(player.armor, Math.floor(dmg / 3));
  player.armor -= saved; player.health -= dmg - saved;
  flashRed = Math.min(0.75, flashRed + dmg / 40); faceTimer = 0.6;
  if (srcX !== undefined) { const ang = Math.atan2(srcY - player.y, srcX - player.x) - player.a; faceLook = Math.sin(ang) > 0.3 ? 1 : Math.sin(ang) < -0.3 ? -1 : 0; }
  if (player.health <= 0) {
    player.health = 0; player.dead = true; sfx('playerDie');
    state = 'dead'; firing = false;
    if (document.pointerLockElement) document.exitPointerLock();
    updateTouchUI();
  } else sfx('hurt');
}

// 投影一個實體到螢幕(供渲染與命中判定共用)
let cam = { dx: 1, dy: 0, px: 0, py: 0.66 };
function project(e) {
  const sx = e.x - player.x, sy = e.y - player.y;
  const inv = 1 / (cam.px * cam.dy - cam.dx * cam.py);
  const tx = inv * (cam.dy * sx - cam.dx * sy);
  const ty = inv * (-cam.py * sx + cam.px * sy);
  return { tx, ty, screenX: (W / 2) * (1 + tx / ty) };
}
function fireWeapon() {
  const w = WEAPONS[player.cur];
  if (player.ammo[w.ammo] <= 0) { sfx('click'); player.cd = 0.4; cycleWeapon(); return; }
  player.ammo[w.ammo]--; player.cd = w.cd;
  muzzle = 0.08; weaponKick = 1;
  sfx(player.cur === 1 ? 'pistol' : player.cur === 2 ? 'shotgun' : 'chaingun');
  // 喚醒附近怪物
  for (const e of ents) if (e.kind === 'monster' && e.state === 'idle') {
    const d = Math.hypot(e.x - player.x, e.y - player.y);
    if (d < 9 || (d < 20 && lineOfSight(e.x, e.y, player.x, player.y))) wake(e);
  }
  const targets = ents.filter(e => (e.kind === 'monster' && e.state !== 'dead') || (e.kind === 'barrel' && e.boom < 0))
    .map(e => ({ e, p: project(e) })).filter(o => o.p.ty > 0.2);
  for (let i = 0; i < w.pellets; i++) {
    const col = clamp(Math.round(W / 2 + (rand() * 2 - 1) * w.spread), 0, W - 1);
    let best = null, bestD = zbuf[col];
    for (const o of targets) {
      const width = (VH / o.p.ty) * (o.e.kind === 'monster' ? o.e.def.width * o.e.def.scale : 0.4);
      if (Math.abs(col - o.p.screenX) < width / 2 && o.p.ty < bestD) { best = o; bestD = o.p.ty; }
    }
    const dmg = randInt(w.dmg[0], w.dmg[1]);
    if (best) {
      hitEntity(best.e, dmg);
      ents.push({ kind: 'fx', type: 'blood', x: best.e.x - cam.dx * 0.3, y: best.e.y - cam.dy * 0.3, t: 0, life: 0.25, z: 0.35 + rand() * 0.2, scale: 0.3 });
      if (best.e.kind === 'barrel') ents[ents.length - 1].type = 'puff';
    } else {
      const camX = 2 * col / W - 1, d = zbuf[col] - 0.05;
      if (d < 30) ents.push({ kind: 'fx', type: 'puff', x: player.x + (cam.dx + cam.px * camX) * d, y: player.y + (cam.dy + cam.py * camX) * d, t: 0, life: 0.25, z: 0.4 + (rand() - 0.5) * 0.2, scale: 0.25 });
    }
  }
}
function hitEntity(e, dmg) {
  e.hp -= dmg;
  if (e.kind === 'barrel') { if (e.hp <= 0 && e.boom < 0) e.boom = 0.12 + rand() * 0.08; return; }
  if (e.state === 'dead') return;
  if (e.hp <= 0) {
    e.state = 'dead'; player.kills++; sfx('die', volAt(e.x, e.y));
    if (e.def.drop) ents.push({ kind: 'pickup', type: e.def.drop, x: e.x + 0.15, y: e.y + 0.1, small: true });
    if (e.def.boss) { bossAlive = false; say('地獄男爵已被擊敗!出口開啟了!', 4); }
    return;
  }
  if (e.state === 'idle') wake(e);
  if (rand() < e.def.pain) { e.state = 'pain'; e.timer = 0.25; sfx('pain', volAt(e.x, e.y) * 0.8); }
}
function wake(e) { if (e.state === 'idle') { e.state = 'chase'; sfx('alert', volAt(e.x, e.y) * 0.7); } }
function explode(b) {
  sfx('explode', volAt(b.x, b.y));
  b.kind = 'fx'; b.type = 'explode'; b.t = 0; b.life = 0.45; b.z = 0; b.scale = 1.3;
  for (const e of ents) {
    if (e === b) continue;
    const d = Math.hypot(e.x - b.x, e.y - b.y);
    if (d < 2.8 && lineOfSight(b.x, b.y, e.x, e.y)) {
      const dmg = Math.round((2.8 - d) / 2.8 * 110);
      if (e.kind === 'monster' && e.state !== 'dead') hitEntity(e, dmg);
      else if (e.kind === 'barrel' && e.boom < 0) e.boom = 0.15 + d * 0.05;
    }
  }
  const pd = Math.hypot(player.x - b.x, player.y - b.y);
  if (pd < 2.8 && lineOfSight(b.x, b.y, player.x, player.y)) damagePlayer(Math.round((2.8 - pd) / 2.8 * 90), b.x, b.y);
}

// ---------- 更新 ----------
function update(dt) {
  levelTime += dt;
  // 轉向
  let turn = mouseDX * 0.0028; mouseDX = 0;
  if (keys.ArrowLeft) turn -= 2.6 * dt;
  if (keys.ArrowRight) turn += 2.6 * dt;
  player.a += turn;
  // 移動
  let fwd = 0, str = 0;
  if (keys.KeyW || keys.ArrowUp) fwd += 1;
  if (keys.KeyS || keys.ArrowDown) fwd -= 1;
  if (keys.KeyD) str += 1;
  if (keys.KeyA) str -= 1;
  fwd -= touchMove.dy; str += touchMove.dx;
  const len = Math.hypot(fwd, str);
  if (len > 1) { fwd /= len; str /= len; }
  const speed = (keys.ShiftLeft || keys.ShiftRight ? 5.2 : 3.4) * dt;
  const ca = Math.cos(player.a), sa = Math.sin(player.a);
  const mx = (ca * fwd - sa * str) * speed, my = (sa * fwd + ca * str) * speed;
  moveEnt(player, mx, my, 0.25, true);
  const moving = Math.hypot(fwd, str);
  moveAmt += (clamp(moving, 0, 1) - moveAmt) * Math.min(1, dt * 8);
  bobT += dt * 9 * moveAmt;
  // 撞到門自動開啟、撞到出口觸發
  if (fwd > 0.3) {
    const [tx, ty] = frontTile(0.6);
    const t = tileAt(tx, ty);
    if (t === DOOR) openDoor(tx, ty);
    else if (t === EXIT && !bossAlive) finishLevel();
  }
  if (state !== 'play') return;
  // 門動畫
  for (const [k, v] of doors) {
    const nv = v + dt * 1.6;
    if (nv >= 1) { map[k] = 0; doors.delete(k); } else doors.set(k, nv);
  }
  // 射擊
  player.cd -= dt;
  if (firing || keys.Space || keys.ControlLeft || keys.ControlRight) { if (player.cd <= 0) fireWeapon(); }
  // 實體
  for (const e of ents) {
    if (e.kind === 'monster') updateMonster(e, dt);
    else if (e.kind === 'proj') updateProj(e, dt);
    else if (e.kind === 'fx') e.t += dt;
    else if (e.kind === 'barrel' && e.boom >= 0) { e.boom -= dt; if (e.boom < 0) explode(e); }
    else if (e.kind === 'pickup') {
      if (Math.hypot(e.x - player.x, e.y - player.y) < 0.6) tryPickup(e);
    }
    if (state !== 'play') break;
  }
  ents = ents.filter(e => !e.remove && !(e.kind === 'fx' && e.t >= e.life));
  // 畫面效果
  flashRed = Math.max(0, flashRed - dt * 1.5);
  flashGold = Math.max(0, flashGold - dt * 2);
  weaponKick = Math.max(0, weaponKick - dt * 6);
  muzzle = Math.max(0, muzzle - dt);
  faceTimer = Math.max(0, faceTimer - dt);
  grin = Math.max(0, grin - dt);
  for (const m of messages) m.t -= dt;
  messages = messages.filter(m => m.t > 0);
}
function tryPickup(e) {
  const p = player; let msg = null, snd = 'pickup';
  switch (e.type) {
    case 'health': if (p.health < 100) { p.health = Math.min(100, p.health + 25); msg = '撿到醫療包 (+25)'; } break;
    case 'bullets': if (p.ammo.bullets < MAXAMMO.bullets) { p.ammo.bullets = Math.min(MAXAMMO.bullets, p.ammo.bullets + (e.small ? 8 : 20)); msg = '撿到彈匣'; } break;
    case 'shells': if (p.ammo.shells < MAXAMMO.shells) { p.ammo.shells = Math.min(MAXAMMO.shells, p.ammo.shells + 6); msg = '撿到一盒霰彈'; } break;
    case 'armor': if (p.armor < 100) { p.armor = 100; msg = '撿到防彈衣!'; } break;
    case 'shotgun':
      p.ammo.shells = Math.min(MAXAMMO.shells, p.ammo.shells + 8);
      if (!p.weapons[2]) { p.weapons[2] = true; p.cur = 2; grin = 1.5; snd = 'weapon'; }
      msg = '撿到霰彈槍!'; break;
    case 'chaingun':
      p.ammo.bullets = Math.min(MAXAMMO.bullets, p.ammo.bullets + 30);
      if (!p.weapons[3]) { p.weapons[3] = true; p.cur = 3; grin = 1.5; snd = 'weapon'; }
      msg = '撿到機槍!'; break;
  }
  if (msg) { say(msg); sfx(snd); flashGold = 0.35; e.remove = true; }
}
function updateMonster(m, dt) {
  if (m.state === 'dead') return;
  const d = m.def;
  const dx = player.x - m.x, dy = player.y - m.y, dist = Math.hypot(dx, dy);
  const sees = dist < 22 && lineOfSight(m.x, m.y, player.x, player.y);
  m.anim += dt * d.speed * 2.5;
  if (m.state === 'idle') { if (sees) wake(m); return; }
  if (m.state === 'pain') { m.timer -= dt; if (m.timer <= 0) m.state = 'chase'; return; }
  if (m.state === 'attack') {
    m.timer -= dt;
    if (!m.fired && m.timer < 0.25) { m.fired = true; monsterAttack(m, dist, sees); }
    if (m.timer <= 0) m.state = 'chase';

  }
  // chase
  m.cool -= dt;

  if (sees && m.cool <= 0) {
    if (dist < meleeRange && d.attack !== 'hitscan') { startAttack(m); return; }
    if (d.attack !== 'melee' && dist < d.range && rand() < dt * 2.5) { startAttack(m); return; }
  }
  if (dist > (d.attack === 'melee' ? 0.9 : 1.1)) {
    let ang = Math.atan2(dy, dx);
    if (m.sideT > 0) { m.sideT -= dt; ang += m.side; }
    const step = d.speed * dt;

  if (flashGold > 0) { sctx.fillStyle = `rgba(255,220,80,${flashGold * 0.4})`; sctx.fillRect(0, 0, W, VH); }
  if (state === 'play') {
    sctx.fillStyle = 'rgba(255,255,255,0.7)';
    sctx.fillRect(W / 2 - 4, HALF, 3, 0.7); sctx.fillRect(W / 2 + 1.5, HALF, 3, 0.7);
    sctx.fillRect(W / 2 - 0.15, HALF - 3.6, 0.7, 3); sctx.fillRect(W / 2 - 0.15, HALF + 1.4, 0.7, 3);
    messages.forEach((m, i) => label(sctx, m.text, 6, 12 + i * 10, '#f2e8d5', 7.5, 'left'));
    if (showMap) drawMinimap(sctx);
  }
  drawStatus(sctx);
  drawOverlay(sctx);
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state === 'play') update(dt);
  else if (state === 'title') player.a += dt * 0.15;
  render();
  requestAnimationFrame(frame);
}
// 標題畫面背景使用第一關場景
loadLevel(0); messages = [];
requestAnimationFrame(frame);
</script>
