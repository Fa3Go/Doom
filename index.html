<title>毀滅戰士 JS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* Layout: full-bleed WebGL canvas; HUD hugs the four corners like a helmet visor; menus are a left-aligned slab over the live scene. Single dark look by choice. */
:root {
  --void: #07080a;
  --slab: rgba(10, 11, 14, 0.78);
  --line: rgba(233, 228, 218, 0.14);
  --text: #ebe6dc;
  --dim: #8f8b84;
  --fire: #ff5a1f;
  --ember: #ffb02e;
  --armor: #3ddc84;
  --plasma: #4fd8ff;
  --danger: #ff2a2a;
  --font-num: "Chakra Petch", "Noto Sans TC", ui-monospace, monospace;
  --font-ui: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { margin: 0; height: 100%; background: var(--void); color: var(--text); overflow: hidden; font-family: var(--font-ui); touch-action: none; -webkit-user-select: none; user-select: none; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#loading { position: fixed; inset: 0; display: grid; place-items: center; font: 700 14px var(--font-num); letter-spacing: 0.3em; color: var(--dim); }

/* ---------- HUD ---------- */
#hud { position: fixed; inset: 0; pointer-events: none; }
#hud[hidden], #touch[hidden], .screen[hidden], #settings[hidden] { display: none; }
.vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 45%, rgba(190, 0, 0, 0.85) 100%); opacity: 0; transition: opacity 0.08s; }
.lowhp { position: absolute; inset: 0; box-shadow: inset 0 0 120px 30px rgba(255, 0, 0, 0.55); opacity: 0; }
.lowhp.on { animation: beat 0.9s infinite; }
@keyframes beat { 0%, 100% { opacity: 0.15; } 15% { opacity: 0.9; } 35% { opacity: 0.35; } 50% { opacity: 0.75; } }
.pickupflash { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 50%, rgba(255, 190, 60, 0.45)); opacity: 0; }

.cross { position: absolute; left: 50%; top: 50%; width: 0; height: 0; --s: 6px; }
.cross i { position: absolute; background: var(--text); box-shadow: 0 0 2px #000; }
.cross i:nth-child(1) { width: 8px; height: 2px; right: var(--s); top: -1px; }
.cross i:nth-child(2) { width: 8px; height: 2px; left: var(--s); top: -1px; }
.cross i:nth-child(3) { width: 2px; height: 8px; left: -1px; bottom: var(--s); }
.cross i:nth-child(4) { width: 2px; height: 8px; left: -1px; top: var(--s); }
.cross b { position: absolute; width: 2px; height: 2px; left: -1px; top: -1px; background: var(--fire); }
.hitmark { position: absolute; left: 50%; top: 50%; width: 26px; height: 26px; margin: -13px 0 0 -13px; opacity: 0; }
.hitmark::before, .hitmark::after { content: ""; position: absolute; left: 12px; top: 0; width: 2px; height: 26px; background: linear-gradient(var(--text) 30%, transparent 30%, transparent 70%, var(--text) 70%); }
.hitmark::before { transform: rotate(45deg); } .hitmark::after { transform: rotate(-45deg); }
.hitmark.kill::before, .hitmark.kill::after { background: linear-gradient(var(--danger) 35%, transparent 35%, transparent 65%, var(--danger) 65%); }
.hitmark.head::before, .hitmark.head::after { background: linear-gradient(var(--ember) 35%, transparent 35%, transparent 65%, var(--ember) 65%); }
.dmgdir { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
.dmgdir span { position: absolute; left: -60px; top: -150px; width: 120px; height: 30px; border-top: 5px solid var(--danger); border-radius: 50% 50% 0 0; filter: drop-shadow(0 0 6px var(--danger)); transform-origin: 60px 150px; animation: fadeDir 1.1s forwards; }
@keyframes fadeDir { from { opacity: 1; } to { opacity: 0; } }

.corner { position: absolute; display: flex; flex-direction: column; gap: 6px; }
.tl { left: calc(20px + env(safe-area-inset-left, 0px)); top: calc(16px + env(safe-area-inset-top, 0px)); }
.bl { left: calc(24px + env(safe-area-inset-left, 0px)); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); }
.br { right: calc(24px + env(safe-area-inset-right, 0px)); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); align-items: flex-end; }
.tr { right: calc(20px + env(safe-area-inset-right, 0px)); top: calc(16px + env(safe-area-inset-top, 0px)); }
.lvl { font: 700 12px var(--font-ui); letter-spacing: 0.12em; color: var(--ember); text-shadow: 0 1px 3px #000; }
.obj { font: 500 13px var(--font-ui); color: var(--text); text-shadow: 0 1px 3px #000; }
.obj b { font-family: var(--font-num); color: var(--fire); }
.stat { display: flex; align-items: baseline; gap: 10px; text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8); }
.stat .ico { width: 22px; height: 22px; align-self: center; }
.stat .num { font: 700 46px/1 var(--font-num); font-variant-numeric: tabular-nums; }
.stat .unit { font: 700 11px var(--font-ui); letter-spacing: 0.2em; color: var(--dim); }
.stat.small .num { font-size: 26px; color: var(--armor); }
.bar { width: 210px; max-width: 40vw; height: 5px; background: rgba(255, 255, 255, 0.12); transform: skewX(-20deg); }
.bar i { display: block; height: 100%; background: var(--text); transition: width 0.15s; }
.bar.armor i { background: var(--armor); }
.ammo .num { color: var(--ember); }
.ammo .res { font: 700 18px var(--font-num); color: var(--dim); font-variant-numeric: tabular-nums; }
.wname { font: 700 12px var(--font-ui); letter-spacing: 0.2em; color: var(--text); }
.slots { display: flex; gap: 4px; }
.slots span { font: 700 11px var(--font-num); width: 22px; height: 18px; display: grid; place-items: center; border: 1px solid var(--line); color: rgba(235, 230, 220, 0.25); transform: skewX(-12deg); }
.slots span.own { color: var(--dim); border-color: rgba(233, 228, 218, 0.3); }
.slots span.cur { color: var(--void); background: var(--ember); border-color: var(--ember); }
#minimap { width: 150px; height: 150px; border: 1px solid var(--line); background: rgba(5, 6, 8, 0.55); }
.feed { position: absolute; left: 50%; bottom: 26%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 4px; }
.feed div { font: 700 15px var(--font-ui); color: var(--text); text-shadow: 0 2px 6px #000; animation: feed 3s forwards; white-space: nowrap; }
.feed div.big { font-size: 20px; color: var(--ember); letter-spacing: 0.1em; }
@keyframes feed { 0% { opacity: 0; transform: translateY(6px); } 8%, 75% { opacity: 1; transform: none; } 100% { opacity: 0; } }
.prompt { position: absolute; left: 50%; top: 58%; transform: translateX(-50%); font: 700 15px var(--font-ui); color: var(--fire); text-shadow: 0 0 10px rgba(255, 90, 31, 0.8), 0 2px 4px #000; letter-spacing: 0.12em; }
.prompt kbd { font: 700 13px var(--font-num); border: 1.5px solid var(--fire); padding: 1px 7px; margin-right: 6px; }
.prompt[hidden] { display: none; }
.bossbar { position: absolute; top: calc(18px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); width: min(460px, 50vw); text-align: center; }
.bossbar[hidden] { display: none; }
.bossbar p { margin: 0 0 4px; font: 900 13px var(--font-ui); letter-spacing: 0.3em; color: var(--danger); text-shadow: 0 0 8px rgba(255, 42, 42, 0.6); }
.bossbar .bar { width: 100%; max-width: none; height: 7px; }
.bossbar .bar i { background: linear-gradient(90deg, #b00, var(--danger)); }

/* ---------- 選單 ---------- */
.screen { position: fixed; inset: 0; display: flex; align-items: center; background: linear-gradient(90deg, rgba(7, 8, 10, 0.92) 0%, rgba(7, 8, 10, 0.7) 45%, rgba(7, 8, 10, 0.15) 100%); padding-inline: max(16px, 7vw); }
.screen.red { background: linear-gradient(90deg, rgba(60, 0, 0, 0.92), rgba(40, 0, 0, 0.55) 60%, rgba(40, 0, 0, 0.2)); }
.panel { display: flex; flex-direction: column; gap: 18px; max-width: 520px; min-width: 0; }
.eyebrow { font: 700 12px var(--font-num); letter-spacing: 0.45em; color: var(--fire); }
.title { margin: 0; font: 900 clamp(56px, 11vw, 120px)/0.95 var(--font-ui); letter-spacing: 0.02em; background: linear-gradient(180deg, #fff3d6 0%, var(--ember) 38%, var(--fire) 62%, #6d1206 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 6px 24px rgba(255, 90, 31, 0.35)); text-wrap: balance; }
.h2 { margin: 0; font: 900 clamp(36px, 6vw, 64px)/1 var(--font-ui); color: var(--text); text-wrap: balance; }
.h2.red { color: var(--danger); text-shadow: 0 0 30px rgba(255, 42, 42, 0.4); }
.lead { margin: 0; font: 500 15px/1.7 var(--font-ui); color: var(--dim); max-width: 46ch; }
.menu { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.menu button, .menu a {
  font: 700 18px var(--font-ui); letter-spacing: 0.12em; color: var(--text); background: none; border: 0; padding: 6px 0 6px 18px; cursor: pointer; position: relative; text-decoration: none;
}
.menu button::before, .menu a::before { content: ""; position: absolute; left: 0; top: 50%; width: 8px; height: 2px; background: var(--dim); transition: width 0.15s, background 0.15s; }
.menu button:hover, .menu button:focus-visible, .menu a:hover, .menu a:focus-visible { color: var(--ember); outline: none; }
.menu button:hover::before, .menu button:focus-visible::before, .menu a:hover::before, .menu a:focus-visible::before { width: 12px; background: var(--fire); }
.menu .primary { font-size: 24px; color: var(--ember); }
.menu .sub { font-size: 14px; color: var(--dim); }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font: 500 13px var(--font-ui); color: var(--dim); }
.keys kbd { font: 700 12px var(--font-num); color: var(--text); white-space: nowrap; }
.stats { display: grid; grid-template-columns: repeat(3, auto); gap: 6px 28px; justify-content: start; }
.stats dt { font: 700 11px var(--font-ui); letter-spacing: 0.2em; color: var(--dim); }
.stats dd { margin: 0; font: 700 30px var(--font-num); color: var(--text); font-variant-numeric: tabular-nums; }
#settings { display: flex; flex-direction: column; gap: 14px; }
#settings label { display: grid; grid-template-columns: 7em 1fr 3em; gap: 12px; align-items: center; font: 500 14px var(--font-ui); color: var(--text); }
#settings output { font: 700 13px var(--font-num); color: var(--ember); text-align: right; }
#settings input[type=range] { accent-color: var(--fire); width: 100%; min-width: 0; }
#settings select { font: 500 14px var(--font-ui); background: #15171c; color: var(--text); border: 1px solid var(--line); padding: 4px 6px; }

/* ---------- 觸控 ---------- */
#touch { position: fixed; inset: 0; pointer-events: none; }
#touch .btns { position: absolute; right: calc(18px + env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: repeat(2, auto); gap: 12px; align-items: end; pointer-events: auto; }
#touch button { font: 700 14px var(--font-ui); color: var(--text); background: rgba(10, 11, 14, 0.45); border: 1.5px solid rgba(235, 230, 220, 0.4); border-radius: 50%; width: 62px; height: 62px; touch-action: none; }
#touch #tFire { width: 86px; height: 86px; grid-row: span 2; border-color: var(--fire); background: rgba(255, 90, 31, 0.3); }
#touch #tMelee { border-color: var(--ember); }
#stick { position: absolute; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%; border: 1.5px solid rgba(235, 230, 220, 0.3); background: rgba(10, 11, 14, 0.25); }
#stick i { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; background: rgba(235, 230, 220, 0.55); }
#stick[hidden] { display: none; }
body.touch .bl, body.touch .br { bottom: auto; top: calc(14px + env(safe-area-inset-top, 0px)); }
body.touch .br { right: auto; left: 50%; transform: translateX(-50%); align-items: center; }
body.touch .tl { display: none; }
body.touch .stat .num { font-size: 30px; }
body.touch #minimap { width: 100px; height: 100px; }
body.touch .bar { width: 120px; }
@media (max-width: 640px) { .stat .num { font-size: 32px; } #minimap { width: 100px; height: 100px; } .keys { display: none; } }
@media (prefers-reduced-motion: reduce) { .lowhp.on { animation: none; opacity: 0.4; } .feed div { animation-duration: 3s; } }
</style>

<canvas id="gl" aria-label="毀滅戰士遊戲畫面"></canvas>
<div id="loading">LOADING</div>

<div id="hud" hidden>
  <div class="pickupflash" id="pickFlash"></div>
  <div class="vignette" id="vig"></div>
  <div class="lowhp" id="lowhp"></div>
  <div class="dmgdir" id="dmgdir"></div>
  <div class="cross" id="cross"><i></i><i></i><i></i><i></i><b></b></div>
  <div class="hitmark" id="hitmark"></div>
  <div class="prompt" id="prompt" hidden><kbd>F</kbd>處決</div>
  <div class="bossbar" id="bossbar" hidden><p>地獄男爵</p><div class="bar"><i id="bossHp"></i></div></div>
  <div class="corner tl">
    <div class="lvl" id="hudLevel"></div>
    <div class="obj" id="hudObj"></div>
  </div>
  <div class="corner tr"><canvas id="minimap" width="300" height="300"></canvas></div>
  <div class="corner bl">
    <div class="stat small">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5z" fill="#3ddc84"/></svg>
      <span class="num" id="armorNum">0</span><span class="unit">護甲</span>
    </div>
    <div class="bar armor"><i id="armorBar"></i></div>
    <div class="stat">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z" fill="#ebe6dc"/></svg>
      <span class="num" id="hpNum">100</span><span class="unit">生命</span>
    </div>
    <div class="bar"><i id="hpBar"></i></div>
  </div>
  <div class="corner br">
    <div class="stat ammo"><span class="num" id="ammoNum">∞</span><span class="res" id="ammoRes"></span></div>
    <div class="wname" id="wname">手槍</div>
    <div class="slots" id="slots"><span>1</span><span>2</span><span>3</span><span>4</span></div>
  </div>
  <div class="feed" id="feed"></div>
</div>

<div id="touch" hidden>
  <div id="stick" hidden><i id="knob"></i></div>
  <div class="btns">
    <button id="tSwap" type="button">換槍</button>
    <button id="tFire" type="button">開火</button>
    <button id="tJump" type="button">跳</button>
    <button id="tMelee" type="button">近戰</button>
  </div>
</div>

<section class="screen" id="scrTitle" hidden>
  <div class="panel">
    <div class="eyebrow">DOOM · JS · 重製版</div>
    <h1 class="title">毀滅戰士</h1>
    <p class="lead">三層地獄設施，四種惡魔。打到牠們搖晃發光，再衝上去處決，噴出的血球能幫你補血。</p>
    <div class="menu">
      <button class="primary" data-act="start" type="button">開始遊戲</button>

    </div>
    <div class="keys" id="keysHelp">
      <kbd>WASD</kbd><span>移動，Shift 奔跑，空白鍵跳躍</span>
      <kbd>滑鼠</kbd><span>瞄準，左鍵開火</span>
      <kbd>1–4 / 滾輪</kbd><span>切換武器</span>
      <kbd>F</kbd><span>近戰；敵人發出橘光時可處決</span>
      <kbd>E</kbd><span>開門、啟動出口</span>
      <kbd>M</kbd><span>切換小地圖</span>
    </div>
  </div>
</section>

<section class="screen" id="scrPause" hidden>
  <div class="panel">
    <div class="eyebrow">PAUSED</div>
    <h2 class="h2">已暫停</h2>
    <div class="menu">
      <button class="primary" data-act="resume" type="button">繼續</button>
      <button data-act="settings" type="button">設定</button>
      <button data-act="restart" type="button">重新開始本關</button>
      <button class="sub" data-act="title" type="button">回到標題</button>
    </div>
  </div>
</section>

<section class="screen" id="scrSettings" hidden>
  <div class="panel">
    <div class="eyebrow">SETTINGS</div>
    <h2 class="h2">設定</h2>
    <div id="settings">
      <label for="sSens">滑鼠靈敏度<input id="sSens" type="range" min="0.3" max="3" step="0.1"><output id="oSens"></output></label>
      <label for="sFov">視野 FOV<input id="sFov" type="range" min="65" max="105" step="1"><output id="oFov"></output></label>
      <label for="sVol">音效音量<input id="sVol" type="range" min="0" max="1" step="0.05"><output id="oVol"></output></label>
      <label for="sMus">音樂音量<input id="sMus" type="range" min="0" max="1" step="0.05"><output id="oMus"></output></label>
      <label for="sQual">畫質<select id="sQual"><option value="high">高（光暈特效）</option><option value="low">低（較流暢）</option></select><span></span></label>
    </div>
    <div class="menu"><button class="primary" data-act="back" type="button">返回</button></div>
  </div>
</section>

<section class="screen red" id="scrDead" hidden>
  <div class="panel">
    <div class="eyebrow">YOU DIED</div>
    <h2 class="h2 red">你陣亡了</h2>
    <dl class="stats" id="deadStats"></dl>
    <div class="menu">
      <button class="primary" data-act="restart" type="button">重新挑戰本關</button>
      <button class="sub" data-act="title" type="button">回到標題</button>
    </div>
  </div>
</section>

<section class="screen" id="scrDone" hidden>
  <div class="panel">
    <div class="eyebrow" id="doneEyebrow">LEVEL COMPLETE</div>
    <h2 class="h2" id="doneTitle">關卡完成</h2>
    <dl class="stats" id="doneStats"></dl>
    <p class="lead" id="doneLead"></p>
    <div class="menu">
      <button class="primary" data-act="next" id="doneNext" type="button">進入下一關</button>
      <button class="sub" data-act="title" type="button">回到標題</button>
    </div>
  </div>
</section>

// ---------- 燈光 ----------
function buildLights() {
  scene.add(new THREE.HemisphereLight(0x6a7488, 0x2a2018, 0.55));
  scene.add(new THREE.AmbientLight(0x404040, 0.35));
  for (let k = 0; k < 8; k++) { const l = new THREE.PointLight(0xffffff, 0, 15, 1.6); scene.add(l); roomLights.push(l); }
  for (let k = 0; k < 4; k++) { const l = new THREE.PointLight(0xffaa55, 0, 10, 2); scene.add(l); dynLights.push({ l, t: 0, life: 1, base: 0 }); }
}
function flashLight(x, y, z, color, intensity, life, dist = 10) {
  let best = dynLights[0]; for (const d of dynLights) if (d.t < best.t) best = d;
  best.l.position.set(x, y, z); best.l.color.setHex(color); best.l.distance = dist; best.base = intensity; best.t = best.life = life;
}
let lightTimer = 0;
function updateLights(dt) {
  for (const d of dynLights) { d.t = Math.max(0, d.t - dt); d.l.intensity = d.base * (d.t / d.life); }
  lightTimer -= dt;
  if (lightTimer <= 0) {
    lightTimer = 0.15;
    const px = player.x, pz = player.z;
    const sorted = lightCands.slice().sort((a, b) => ((a.x - px) ** 2 + (a.z - pz) ** 2) - ((b.x - px) ** 2 + (b.z - pz) ** 2));
    roomLights.forEach((l, k) => { const c = sorted[k]; l.userData.c = c; if (c) { l.position.set(c.x, WH - 0.35, c.z); l.color.copy(c.color); } });
  }
  for (const l of roomLights) {
    const c = l.userData.c; if (!c) { l.intensity = 0; continue; }
    let k = 1.7;
    if (c.flicker) { const f = Math.sin(time * 23 + c.phase) + Math.sin(time * 7.3 + c.phase * 2); k *= f > 1.3 ? 0.15 : 1; fixtureMesh.setColorAt(c.idx, c.color.clone().multiplyScalar(f > 1.3 ? 0.3 : 3)); fixtureMesh.instanceColor.needsUpdate = true; }
    l.intensity = k;
  }
}

const keys = {};

function updateMonster(m, dt) {

    const moved = Math.hypot(m.x - ox, m.z - oz);

    if (moved < step * 0.3) {

//  視覺更新(動畫)
// ============================================================
const ORANGE = new THREE.Color(1, 0.35, 0.05), RED = new THREE.Color(1, 0.1, 0.05), BLACK = new THREE.Color(0, 0, 0);
function animateMonster(m, dt) {
  const { root, body, P, mats } = m.mdl;
  root.position.set(m.x, 0, m.z);
  let cur = root.rotation.y, diff = Math.atan2(Math.sin(m.face - cur), Math.cos(m.face - cur));
  root.rotation.y = cur + diff * Math.min(1, dt * 10);

  const sw = m.state === 'chase' ? 1 : m.state === 'idle' ? 0.05 : 0.2;
  if (m.state === 'dead') {
    const k = Math.min(1, m.deadT / 0.45);
    body.rotation.x = lerp(body.rotation.x, -Math.PI / 2, k);
    body.position.y = lerp(body.position.y, 0.2, k) - Math.max(0, m.deadT - 8) * 0.2;

  }

  for (const k of ['legR', 'legR2']) if (P[k]) P[k].rotation.x = -Math.sin(w) * 0.7 * sw;
  body.position.y = Math.abs(Math.cos(w)) * 0.06 * sw;
